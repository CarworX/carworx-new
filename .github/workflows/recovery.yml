name: K4 recovery
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "scripts/ops/backup/**"
      - "supabase/**"
      - ".github/workflows/recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - name: Install pinned tools
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          pnpm install --frozen-lockfile
          key="$RUNNER_TEMP/postgresql.asc"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 20 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key"
          gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" && $10 == "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" { found=1 } END { exit !found }'
          sudo install -m 0644 "$key" /usr/share/keyrings/carworx-pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/carworx-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/carworx-pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends postgresql-client-17
      - name: Export and restore synthetic data
        run: |
          node scripts/ops/backup/drill.js "$PWD" "$TESTED_SHA" /usr/lib/postgresql/17/bin --ci > "$RUNNER_TEMP/k4-summary.json"
          test -s "$RUNNER_TEMP/k4-summary.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: k4-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k4-summary.json
          retention-days: 7
          if-no-files-found: error
