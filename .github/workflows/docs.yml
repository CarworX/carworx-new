name: Docs check

# Docs-only PRs (everything under planning/ or in *.md) skip K1 (ci.yml
# paths-ignore) and run this instead: the same pinned secrets scan as K1,
# plus the repo's format check. About 1 minute instead of about 7.
# Note: staging deploys need a K1 run at the deployed head, so deploy from
# the latest code PR's head; docs-only merges change nothing deployed.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "planning/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: docs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  docs:
    # Drafts don't run CI (saves Actions minutes); the run starts at ready_for_review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify scanner checksum and adversarial fixtures
        run: node scripts/ci/secrets.js setup
      - name: All history reachable from tested head
        run: node scripts/ci/secrets.js history
      - name: Clean checkout before dependency installation
        run: node scripts/ci/secrets.js checkout
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
