<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnings · CarworX business (prototype)</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/studio.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 16px; }
  .head h1 { font: 500 40px/44px var(--font-sans); letter-spacing: -.035em; }
  @media (max-width: 640px) { .head h1 { font-size: 30px; line-height: 34px; } }
</style>
</head>
<body class="cx-canvas">
<div data-shell></div>
<main>
  <div class="head"><p class="cx-eyebrow">Shine Bay Car Wash</p><h1>Earnings</h1><p class="t-cap" style="margin-top:4px">Owners and managers see this. Prototype: synthetic data, as if bookings had been running since November 2024.</p></div>
  <div data-money></div>
</main>
<script src="../_shared/kit.js"></script>
<script src="../_shared/shell.js"></script>
<script src="../_shared/money.js"></script>
<script>
  const as = new URLSearchParams(location.search).get("as") === "manager" ? "manager" : "owner";
  SHELL.mount(document.querySelector("[data-shell]"), { role: as, current: "earnings" });
  MONEY.mount(document.querySelector("[data-money]"), { scope: "business", seed: 11 });
</script>
</body>
</html>
