<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile and settings · CarworX (prototype)</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/studio.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  /* Profile and settings for every user. Shared tabs for all; one extra tab by role. Synthetic. */
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 18px; }
  .who { display: flex; gap: 14px; align-items: center; }
  .who .sh-av { width: 56px; height: 56px; font-size: 18px; }
  .who h1 { font: 500 32px/36px var(--font-sans); letter-spacing: -.03em; }
  .panel { display: grid; gap: 14px; }
  .box { display: grid; gap: 12px; padding: 18px; border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--sh-1); }
  .box h2 { font: 500 18px/24px var(--font-sans); letter-spacing: -.01em; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .box p { font: 400 14px/21px var(--font-sans); color: var(--graphite); }
  .line { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hair); font: 400 14px var(--font-sans); }
  .line:first-of-type { border-top: 0; }
  .line small { display: block; color: var(--muted); font-size: 13px; }
  .line a, .line .ob-link { white-space: nowrap; }
  .field { display: grid; gap: 6px; font: 500 13px var(--font-sans); }
  .codes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font: 500 14px var(--font-mono); }
  .codes span { padding: 8px 10px; border-radius: var(--radius-sm); background: var(--canvas); }
  .qr { width: 140px; height: 140px; border-radius: var(--radius-md); background:
    conic-gradient(from 90deg at 20% 20%, var(--ink) 25%, transparent 0) 0 0 / 25% 25%,
    repeating-linear-gradient(0deg, var(--ink) 0 7px, transparent 7px 14px), var(--surface);
    box-shadow: inset 0 0 0 10px var(--surface), inset 0 0 0 11px var(--line); }
  .key { font: 500 14px var(--font-mono); padding: 10px 12px; border-radius: var(--radius-sm); background: var(--canvas); letter-spacing: .08em; }
  .otp { font: 500 26px var(--font-mono); letter-spacing: .4em; text-align: center; max-width: 260px; }
  .danger { color: var(--err); }
  .acts { display: flex; gap: 12px; align-items: center; }
  .acts .cx-btn.primary { margin-left: auto; }
</style>
</head>
<body class="cx-canvas">
<div data-shell></div>
<main>
  <div style="display:grid;gap:6px"><span class="ob-demo">Demo · view as</span>
    <div class="ob-picks" role="radiogroup" aria-label="View as" data-roles></div></div>
  <div class="who"><span class="sh-av" data-ini></span><div><p class="cx-eyebrow" data-sub></p><h1>Profile and settings</h1></div></div>
  <div class="cx-tabs" role="tablist" aria-label="Settings sections" data-tabs></div>
  <div class="panel" role="tabpanel" data-panel></div>
</main>
<script src="../_shared/kit.js"></script>
<script src="../_shared/shell.js"></script>
<script>
  const { ic, esc } = OB;
  const q = new URLSearchParams(location.search);
  let as = q.get("as") || "owner", tab = q.get("tab") || "profile";
  const mfa = { on: q.get("mfa") === "on", step: q.get("mfastep") ? +q.get("mfastep") : -1, method: "Authenticator app" };
  const biz = () => as === "owner" || as === "manager";
  const TABS = () => [["profile", "Profile"], ["security", "Security"], ["notifications", "Notifications"], ["privacy", "Privacy and data"], ...(as === "staff" ? [["work", "Your work"]] : []), ...(biz() ? [["business", "Business"]] : [])];
  const sw = (name, label, hint, on) => `<label class="ob-switch"><span><span class="ob-qt">${label}</span>${hint ? `<span class="ob-qh" style="display:block;font-weight:400">${hint}</span>` : ""}</span><input type="checkbox" role="switch" name="${name}"${on ? " checked" : ""}><span class="track" aria-hidden="true"></span></label>`;
  // The approved gliding segmented bar, driven directly here.
  let prevStep = 0;
  function seg(el, at, n, name) {
    const from = Math.min(prevStep, n - 1);
    if (!el.querySelector(".segs") || el._n !== n) {
      el.innerHTML = `<div class="segrow"><span class="segname"></span><span class="segcount"></span></div><div class="segs">${'<span class="seg"><i></i></span>'.repeat(n)}</div>`;
      el._n = n;
      el.setAttribute("role", "progressbar");
    }
    // Draw at the previous step, then glide to this one (forward fills, back drains).
    const segs = [...el.querySelectorAll(".seg")];
    el.classList.add("still");
    segs.forEach((s, k) => s.classList.toggle("on", k <= from));
    void el.offsetWidth;
    el.classList.remove("still");
    requestAnimationFrame(() => segs.forEach((s, k) => s.classList.toggle("on", k <= at)));
    prevStep = at;
    el.querySelector(".segname").textContent = name;
    el.querySelector(".segcount").textContent = `${at + 1} of ${n}`;
    el.setAttribute("aria-valuetext", `Step ${at + 1} of ${n}: ${name}`);
  }
  const MFA_STEPS = () => (mfa.method === "Passkey" ? ["Choose a method", "Create your passkey", "Save recovery codes"] : ["Choose a method", "Scan the code", "Enter the code", "Save recovery codes"]);
  function mfaFlow() {
    const S = MFA_STEPS(), i = mfa.step, name = S[i];
    let body = "";
    if (name === "Choose a method") body = `<div class="ob-tiles" style="grid-template-columns:1fr">${[["Authenticator app", "A free app on your phone gives you a 6-digit code. Recommended.", "lock"], ["Passkey", "Use this device's fingerprint, face or PIN. No codes to type.", "user"]].map(([v, d, k]) => `<label class="ob-tile"><input type="radio" name="mfam" value="${v}"${mfa.method === v ? " checked" : ""}><span class="ic">${ic(k)}</span><b>${v}</b><small>${d}</small></label>`).join("")}</div>`;
    if (name === "Scan the code") body = `<p>Open your authenticator app and scan this code. Can't scan? Type the key instead.</p><div class="qr" role="img" aria-label="QR code (illustration)"></div><p class="key">JBSW Y3DP EHPK 3PXP</p>`;
    if (name === "Enter the code") body = `<label class="field">The 6-digit code from your app<input class="ob-input otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••"></label><p class="ob-err" role="alert" data-otperr></p>`;
    if (name === "Create your passkey") body = `<p>Your browser will ask you to confirm with your fingerprint, face or device PIN.</p><button type="button" class="cx-btn outlined sm" data-mfa-next>Create passkey</button>`;
    if (name === "Save recovery codes") body = `<p>If you lose your phone, each of these codes signs you in once. Keep them somewhere safe.</p><div class="codes">${["4F7K-29QD", "M8X2-LP4T", "Q3ZR-71VN", "B6HW-X0CJ", "T9EA-5KMS", "R2YU-8DGF", "H5NB-3QWL", "C7PV-6ZRT"].map((c) => `<span>${c}</span>`).join("")}</div><div class="acts" style="flex-wrap:nowrap"><button type="button" class="cx-btn outlined sm">Download</button><button type="button" class="cx-btn outlined sm">Copy</button></div><div class="ob-consent"><label class="cx-check"><input type="checkbox" name="saved"><span class="cx-box" aria-hidden="true">${ic("tick")}</span><span>I've saved my recovery codes</span></label></div><p class="ob-err" role="alert" data-savederr></p>`;
    return `<div class="box" data-mfabox><h2>Set up two-step sign-in</h2><div class="ob-segbar" data-mfaseg aria-label="Two-step sign-in setup"></div>${body}
      <div class="acts"><button type="button" class="ob-back" data-mfa-back>${i === 0 ? "Cancel" : "Back"}</button><button type="button" class="cx-btn primary" data-mfa-next>${i === S.length - 1 ? "Turn on" : "Next"}</button></div></div>`;
  }
  const P = {
    profile: () => `<div class="box"><h2>Your details</h2>
        <label class="field">Full name<input class="ob-input" value="${esc(SHELL.WHO[as].name)}" autocomplete="name"></label>
        <div class="line"><span>Email<small>${as === "driver" ? "thandi" : SHELL.WHO[as].name.split(" ")[0].toLowerCase()}@example.co.za</small></span><span class="cx-label">Verified</span><button type="button" class="ob-link">Change</button></div>
        <label class="field">Mobile number <span class="ob-opt">(optional)</span><input class="ob-input" inputmode="tel" autocomplete="tel" placeholder="For example, 072 000 0000"><span class="ob-qh">${as === "driver" ? "So a business can reach you about a booking." : "So your team can reach you about a booking."}</span></label>
        <div class="line"><span>Profile photo<small>${as === "staff" ? "Shown to customers with your first name, if your business lets customers pick." : "Optional."}</small></span><button type="button" class="cx-btn outlined sm">Add photo</button></div>
        <div class="acts"><button type="button" class="cx-btn primary">Save</button></div></div>
        <p class="ob-private">${ic("lock")}<span>We never ask for your ID number or date of birth.</span></p>`,
    security: () => `<div class="box"><h2>Two-step sign-in ${mfa.on ? '<span class="cx-label">On</span>' : '<span class="cx-label warn">Off</span>'}</h2>
        <p>${mfa.on ? `${mfa.method} · added 12 Nov 2026. Each new sign-in needs it.` : "Adds a second check when you sign in, so a stolen password isn't enough."}</p>
        <p class="t-cap">${{ owner: "Required before anyone can change payment settings, when payments open.", manager: "Strongly recommended: you can edit the listing and invite people.", staff: "Recommended.", driver: "Recommended." }[as]}</p>
        ${mfa.on ? `<div class="line"><span>Recovery codes<small>8 one-time codes</small></span><button type="button" class="ob-link">Make new codes</button></div><div class="line"><span>Turn off two-step sign-in</span><button type="button" class="ob-link danger" data-mfa-off>Turn off</button></div>` : mfa.step < 0 ? `<div><button type="button" class="cx-btn primary sm" data-mfa-start>Turn on two-step sign-in</button></div>` : ""}
      </div>
      ${!mfa.on && mfa.step >= 0 ? mfaFlow() : ""}
      <div class="box"><h2>Signing in</h2>
        <div class="line"><span>Password<small>Last changed 3 Nov 2026</small></span><button type="button" class="ob-link">Change</button></div>
        <div class="line"><span>Passkey for sign-in<small>Sign in with your fingerprint, face or PIN instead of a password</small></span><button type="button" class="ob-link">Add</button></div></div>
      <div class="box"><h2>Where you're signed in</h2>
        <div class="line"><span>This device<small>Chrome on Android · active now</small></span><span class="cx-label info">This device</span></div>
        <div class="line"><span>Safari on iPhone<small>Last used 10 Nov 2026, 18:20 SAST</small></span><button type="button" class="ob-link">Sign out</button></div>
        <div><button type="button" class="cx-btn outlined sm">Sign out of all other devices</button></div></div>`,
    notifications: () => `<div class="box"><h2>Email me about</h2>
        ${as === "driver" ? sw("n1", "My bookings", "Accepted, payment due, reminders and changes.", true) + sw("n2", "Quotes", "When a business sends or updates a written quote.", true) : sw("n1", "New booking requests", "You have 2 business hours to accept each one.", true) + sw("n2", "Reminders before a request runs out", "", true) + (biz() ? sw("n3", "Team changes", "Invites accepted, people leaving, setting changes.", true) : sw("n3", "When a booking is assigned to me", "", true))}
        ${sw("n9", "News and offers from CarworX", "Off unless you turn it on.", false)}
        <p class="t-cap">Email for now. SMS and WhatsApp come later.</p></div>`,
    privacy: () => `<div class="box"><h2>Your data</h2>
        <div class="line"><span>Download my data<small>A copy of what CarworX holds about you</small></span><button type="button" class="ob-link">Request</button></div>
        <div class="line"><span>What you agreed to<small>${as === "driver" ? "Terms · 2 Nov 2026" : "Listing consent · 11 Nov 2026 · Terms · 2 Nov 2026"}</small></span><button type="button" class="ob-link">View</button></div></div>
      <div class="box"><h2>Delete my account</h2>
        <p>${as === "owner" ? "You own Shine Bay Car Wash. Transfer ownership or close the listing first, under Business." : as === "driver" ? "Past bookings stay with the businesses for their records; your account and profile go." : "You'll leave Shine Bay Car Wash. Its booking records stay with the business."}</p>
        <div><button type="button" class="cx-btn outlined sm danger"${as === "owner" ? ' aria-disabled="true"' : ""}>Delete my account</button></div></div>`,
    work: () => `<div class="box"><h2>Your work at Shine Bay Car Wash</h2>
        <p class="ob-qt">What you work on</p><div class="ob-picks">${["Wash & Detailing", "Glass Repair & Replacement"].map((v, i) => `<label class="ob-pick multi"><input type="checkbox" data-multi${i === 0 ? " checked" : ""}>${v}</label>`).join("")}</div>
        <p class="ob-qt">Days you work</p><div class="ob-picks">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((v, i) => `<label class="ob-pick multi"><input type="checkbox"${i < 5 ? " checked" : ""}>${v}</label>`).join("")}</div></div>
      <div class="box"><h2>Leave this team</h2><p>Sipho and Ayanda will see that you left. Your past bookings stay in the business's History.</p><div><button type="button" class="cx-btn outlined sm danger">Leave Shine Bay Car Wash</button></div></div>`,
    business: () => `<div class="box"><h2>Shine Bay Car Wash</h2>
        <div class="line"><span>Team and roles<small>Invite, change roles, remove</small></span><a class="ob-link" href="../setup/index.html#t-team">Open</a></div>
        <div class="line"><span>Who gets the booking<small>The customer picks, with "Anyone available"</small></span><a class="ob-link" href="../setup/index.html#b-assign">Change</a></div>
        ${as === "owner" ? `<div class="line"><span>What staff can see<small>First name only</small></span><a class="ob-link" href="../setup/index.html#p-contact">Change</a></div>` : ""}
        <div class="line"><span>Listing details<small>Name, services, hours, location, photo</small></span><button type="button" class="ob-link">Edit</button></div>
        ${as === "owner" ? `<div class="line"><span>Payments<small>Opens with bookings. Needs two-step sign-in.</small></span><span class="ob-lbl-off">Later</span></div>` : ""}</div>
      ${as === "owner" ? `<div class="box"><h2>Ownership</h2><div class="line"><span>Transfer ownership<small>To a manager. They must have two-step sign-in on.</small></span><button type="button" class="ob-link">Start</button></div><div class="line"><span>Close the business listing<small>Removes it from search. History stays.</small></span><button type="button" class="ob-link danger">Close</button></div></div>` : `<div class="box"><h2>Leave this business</h2><p>Sipho will see that you left.</p><div><button type="button" class="cx-btn outlined sm danger">Leave Shine Bay Car Wash</button></div></div>`}`,
  };
  let mounted = null;
  function render() {
    if (mounted !== as) { SHELL.mount(document.querySelector("[data-shell]"), { role: as, current: tab === "security" ? "security" : tab === "business" ? "business" : "profile" }); mounted = as; }
    if (!TABS().some(([k]) => k === tab)) tab = "profile";
    document.querySelector("[data-roles]").innerHTML = [["driver", "Driver · Thandi"], ["staff", "Staff · Lerato"], ["manager", "Manager · Ayanda"], ["owner", "Owner · Sipho"]].map(([v, t]) => `<label class="ob-pick"><input type="radio" name="as" value="${v}"${v === as ? " checked" : ""}>${t}</label>`).join("");
    document.querySelector("[data-ini]").textContent = SHELL.WHO[as].ini;
    document.querySelector("[data-sub]").textContent = SHELL.WHO[as].sub;
    document.querySelector("[data-tabs]").innerHTML = TABS().map(([k, t]) => `<button type="button" role="tab" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join("");
    document.querySelector("[data-panel]").innerHTML = P[tab]();
    const sg = document.querySelector("[data-mfaseg]");
    if (sg) seg(sg, mfa.step, MFA_STEPS().length, MFA_STEPS()[mfa.step]);
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); document.querySelector(`[data-tab="${tab}"]`).focus(); }
    else if (t.hasAttribute("data-mfa-start")) { mfa.step = 0; render(); document.querySelector("[data-mfabox] h2").setAttribute("tabindex", "-1"); document.querySelector("[data-mfabox] h2").focus(); }
    else if (t.hasAttribute("data-mfa-off")) { mfa.on = false; mfa.step = -1; render(); }
    else if (t.hasAttribute("data-mfa-back")) { mfa.step -= 1; render(); }
    else if (t.hasAttribute("data-mfa-next")) {
      const S = MFA_STEPS(), name = S[mfa.step];
      if (name === "Enter the code") { const v = document.querySelector("[name=otp]").value; if (!/^\d{6}$/.test(v)) { document.querySelector("[data-otperr]").textContent = "Enter the 6 digits from your app."; document.querySelector("[name=otp]").focus(); return; } }
      if (name === "Save recovery codes") { if (!document.querySelector("[name=saved]").checked) { document.querySelector("[data-savederr]").textContent = "Tick this once you've saved them."; return; } mfa.on = true; mfa.step = -1; render(); return; }
      mfa.step += 1; render();
    }
  });
  // Clear an error as soon as it's fixed.
  document.addEventListener("input", (e) => { if (e.target.name === "otp") document.querySelector("[data-otperr]").textContent = ""; });
  document.addEventListener("change", (e) => {
    if (e.target.name === "saved") document.querySelector("[data-savederr]").textContent = "";
    if (e.target.name === "as") { as = e.target.value; mfa.on = false; mfa.step = -1; render(); }
    if (e.target.name === "mfam") { mfa.method = e.target.value; render(); }
  });
  render();
  if (q.get("menu")) document.querySelector("[data-sh-menu]").click();
  if (q.get("drop")) document.querySelector("[data-sh-me]").click();
</script>
</body>
</html>
