<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarworX Presentation Pack</title>
<meta name="description" content="CarworX planning presentation pack (PLAN §22), in the Studio direction. Concept, not final. Fictional names and demo data only.">
<style>
/* Fonts: Geist, Geist Mono and Caveat (SIL OFL 1.1), latin subsets bundled from src/vendor/fonts. */
@font-face{font-family:"Geist";font-weight:200 700;font-style:normal;font-display:swap;src:url({{font:Geist-latin.woff2}}) format("woff2")}
@font-face{font-family:"Geist Mono";font-weight:400 500;font-style:normal;font-display:swap;src:url({{font:GeistMono-latin.woff2}}) format("woff2")}
@font-face{font-family:"Caveat";font-weight:500 600;font-style:normal;font-display:swap;src:url({{font:Caveat-latin.woff2}}) format("woff2")}
:root{
  /* Studio UI language (chosen direction, concept, not final) */
  --canvas:#f2f1ee;--canvas-2:#e9e7e2;--dot:rgba(13,15,18,.12);
  --ink:#0d0f12;--graphite:#1c2128;--muted:#5b6470;--quiet:#727a85;--steel:#8a97a6;--hair:rgba(13,15,18,.09);--line:#dedcd6;
  --white:#fff;--paper:#f4efe6;
  --blue:#3d6dff;--blue-ink:#2a54d4;--blue-soft:#a9c0ff;--sky:#e3eaff;
  --signal:#ff3b0a;--apricot:#ffb08a;--peach:#ffe3d4;--note:#ffe9a6;--key-side:#e2e0db;
  /* Status colours: concept additions, each 5.6:1 or better on its own background */
  --ok:#1e6b45;--ok-bg:#e7f4ec;--warn:#8a5300;--warn-bg:#fff4e0;--err:#a61b1b;--err-bg:#fdecea;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --hand:"Caveat","Segoe Print",cursive;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:40px;--s6:48px;--s8:64px;--s10:80px;--s12:96px;
  --r-sm:12px;--r:16px;--r-md:24px;--r-lg:32px;
  --sh-1:0 1px 1px rgba(13,15,18,.04),0 2px 6px rgba(13,15,18,.04),0 8px 24px rgba(13,15,18,.06);
  --sh-2:0 1px 2px rgba(13,15,18,.05),0 8px 16px rgba(13,15,18,.05),0 16px 32px rgba(13,15,18,.08),0 40px 80px rgba(13,15,18,.08);
  --sh-3:0 2px 3px rgba(13,15,18,.06),0 8px 24px rgba(13,15,18,.07),0 32px 64px rgba(13,15,18,.10),0 64px 120px rgba(13,15,18,.10);
  --ds-2:drop-shadow(0 2px 2px rgba(13,15,18,.07)) drop-shadow(0 16px 24px rgba(13,15,18,.14));
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --gutter:clamp(16px,4vw,48px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background-color:var(--canvas);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:24px 24px;color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,h4,h5{font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:0 0 .5em;text-wrap:balance}
p,li{text-wrap:pretty}
p{margin:0 0 1em}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}
.skip{position:absolute;left:16px;top:-80px;z-index:200;background:var(--ink);color:#fff;padding:12px 16px;border-radius:999px;font-weight:500;text-decoration:none}
.skip:focus{top:96px}
.cx{display:block;height:auto}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ko{display:block;width:100%;height:100%;overflow:visible;filter:var(--ds-2)}
.ill{display:block;width:120px;height:84px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.grey{color:var(--quiet)}
section{scroll-margin-top:96px}

/* ---------- shared parts ---------- */
.eyebrow{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.h2{font-size:clamp(34px,5vw,64px);line-height:1.02;letter-spacing:-.04em;margin:0}
.h2 .ln{display:block}
.lede{font-size:clamp(17px,1.4vw,19px);color:var(--muted);max-width:62ch;margin:var(--s3) 0 0}
.sec{padding:clamp(80px,10vw,144px) 0 0}
.badge{display:inline-flex;align-items:center;gap:var(--s1);min-height:32px;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:var(--sh-1);font-size:13px;font-weight:500;color:var(--graphite)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px rgba(255,59,10,.14);flex:none}
.pill{display:inline-flex;align-items:center;gap:var(--s1);min-height:52px;padding:0 8px 0 22px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;text-decoration:none;box-shadow:var(--sh-2);transition:transform .5s var(--ease)}
.pill .arr{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.pill .arr .ic{width:16px;height:16px}
.pill:hover{transform:translateY(-2px)}
.pill.light{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.pill.light .arr{background:var(--canvas)}
.card{background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:var(--s3)}
.card h3{font-size:22px;margin:0 0 var(--s2)}
.card ul,.card ol{margin:0;padding-left:20px}
.card li+li{margin-top:var(--s1)}
.grid2{display:grid;gap:var(--s3)}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.callout{display:flex;gap:var(--s2);align-items:flex-start;background:#fff;border-radius:var(--r-md);padding:var(--s3);margin-top:var(--s3);box-shadow:var(--sh-1);border:1px solid #fff}
.callout .ic{color:var(--signal);margin-top:2px}
.est{font:500 12px var(--mono);color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle;letter-spacing:0}
table.t{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
table.t th,table.t td{text-align:left;vertical-align:top;padding:12px 16px;border-bottom:1px solid var(--hair)}
table.t th{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#fafaf8}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;border-radius:var(--r-md);box-shadow:var(--sh-1);border:1px solid #fff;background:#fff}
.tscroll table{min-width:560px}

/* ---------- intro (Studio: glyphs resolve into the full-scale lockup, then FLIP into the nav) ---------- */
#intro{position:fixed;inset:0;z-index:150;display:none;place-items:center;cursor:pointer;overflow:hidden}
#intro .ibg{position:absolute;inset:0;background-color:var(--canvas);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:24px 24px}
#intro .stage{position:relative;width:min(78vw,1180px);text-align:center}
#intro .lk{width:100%;overflow:visible;color:var(--ink);transform-origin:0 0;display:block}
#intro .glyph-slot{font-family:var(--mono);font-size:100px;fill:var(--quiet)}
#intro .housing,#intro .pressure{fill:none;stroke:var(--steel);stroke-width:1.1}
#intro .ticks line{stroke:var(--steel);stroke-width:1.1;stroke-linecap:round}
.intro-sub{margin-top:clamp(24px,3.5vw,48px);font-size:clamp(20px,2.2vw,32px);letter-spacing:-.025em;font-weight:500;color:var(--graphite);line-height:1.2}
.intro-sub p{margin:0}
.intro-sub .k{display:block;margin-top:var(--s1);font-weight:400;color:var(--muted);font-size:.8em}
.intro-skip{position:absolute;bottom:var(--s4);left:50%;transform:translateX(-50%);font:500 12px var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
html.intro-on{overflow:hidden}
html.intro-on #intro{display:grid}
@media (max-width:599px){#intro{padding-bottom:9vh}#intro .stage{width:90vw}#intro .stage.stacked .lk{margin:19.5vw 0}#intro .stage.stacked .intro-sub{margin-top:calc(19.5vw + var(--s4))}}

/* ---------- nav ---------- */
.top{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;width:min(1200px,calc(100% - 32px));min-height:64px;display:flex;align-items:center;gap:var(--s2);padding:8px 8px 8px 24px;border-radius:999px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.9);box-shadow:var(--sh-1)}
.top .logo{width:124px;color:var(--ink);flex:none;border-radius:8px}
.top nav{flex:1;min-width:0}
.top ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:2px}
.top nav a{display:block;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--ink);background:rgba(13,15,18,.04)}
.top .badge{box-shadow:none;background:var(--canvas);border-color:transparent;flex:none}
html.logo-wait .top .logo{visibility:hidden}
.menu-btn{display:none;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);border:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;margin-left:auto}
.menu-btn i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink);transition:transform .4s var(--ease)}
.menu-btn[aria-expanded="true"] i:first-child{transform:translateY(3px) rotate(45deg)}
.menu-btn[aria-expanded="true"] i:last-child{transform:translateY(-3px) rotate(-45deg)}
.scrim{position:fixed;inset:0;z-index:48;background:rgba(242,241,238,.6);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.sheet{position:fixed;top:88px;left:16px;right:16px;z-index:49;padding:var(--s1) var(--s2) var(--s2);border-radius:var(--r-md);background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid #fff;box-shadow:var(--sh-3);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:50% 0;transition:opacity .35s var(--ease),transform .45s var(--ease),visibility 0s .45s}
.sheet.open{opacity:1;visibility:visible;transform:none;transition:opacity .35s var(--ease),transform .45s var(--ease)}
.sheet a.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 var(--s1);font-size:19px;font-weight:500;letter-spacing:-.02em;text-decoration:none;border-bottom:1px solid var(--hair)}
.sheet a.row .ic{color:var(--muted)}
.sheet .acts{display:grid;gap:var(--s1);margin-top:var(--s2)}
.sheet .acts .pill{justify-content:space-between}
html.menu-open{overflow:hidden}
@media (max-width:1060px){.top nav,.top .badge{display:none}.menu-btn{display:flex}}
@media (max-width:599px){.top{min-height:56px;padding-left:16px}.menu-btn{width:40px;height:40px}.sheet{top:80px}}

/* ---------- cover ---------- */
.cover{position:relative;min-height:max(100svh,760px);display:flex;align-items:center;padding:144px 0 var(--s10);overflow-x:clip}
.cover .copy{position:relative;z-index:2;max-width:880px;margin:0 auto;text-align:center}
.cover h1{font-size:clamp(38px,5.6vw,80px);line-height:1.02;letter-spacing:-.045em;margin:var(--s3) 0 0}
.cover h1 span{display:block}
.cover p{font-size:clamp(16px,1.3vw,18px);color:var(--muted);max-width:620px;margin:var(--s3) auto 0}
.cover .cta{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;margin-top:var(--s4)}
.floats{position:absolute;inset:0;z-index:1;pointer-events:none}
.obj{position:absolute;animation:drift var(--dur,9s) ease-in-out infinite alternate;animation-delay:var(--del,0s)}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(var(--r0,0deg))}to{transform:translate3d(6px,-12px,0) rotate(var(--r1,2deg))}}
.f-note{left:3%;top:18%;width:176px;--r0:-7deg;--r1:-4deg;--dur:8s}
.f-tile{right:3%;top:19%;width:252px;--r0:4deg;--r1:2deg;--dur:10s;--del:-3s}
.f-timer{right:7%;top:58%;width:148px;--r0:6deg;--r1:2deg;--dur:9s;--del:-2s}
.f-receipt{left:5%;top:56%;width:196px;--r0:-4deg;--r1:-6deg;--dur:10s;--del:-1s}
@media (max-width:1180px){.f-note{width:140px}.f-tile{width:210px;top:15%}.f-timer{width:120px;top:64%}.f-receipt{width:170px;top:62%}}
@media (max-width:900px){.f-tile,.f-receipt{display:none}.f-note{left:16px;top:92px;width:104px}.f-timer{right:16px;top:96px;width:92px}.cover{padding-top:220px}}
@media (max-width:599px){.f-note{width:84px;left:8px}.f-timer{width:76px;right:10px}.cover{padding-top:208px;min-height:auto}}
html.motion .cover .reveal{opacity:0;transform:translateY(24px)}
html.motion.go .cover .reveal{opacity:1;transform:none;transition:opacity 1s var(--ease),transform 1.1s var(--ease);transition-delay:calc(var(--i,0) * 80ms)}
html.motion .floats .obj-in{opacity:0;transform:translateX(calc(var(--side) * 30vw)) scale(.7)}
html.motion.go .floats .obj-in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform 1.4s var(--spring)}

/* tactile objects */
.sticky{position:relative;aspect-ratio:1;padding:var(--s3) var(--s2) var(--s2);background:linear-gradient(160deg,#fff1bd,var(--note) 55%,#fbe08f);border-radius:3px 3px 3px 16px;box-shadow:var(--sh-2);color:#3a3326;text-align:left}
.sticky::before{content:"";position:absolute;left:50%;top:-12px;width:72px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.sticky p{margin:0;font:600 24px/1.05 var(--hand)}
.sticky p+p{margin-top:var(--s1);font-size:19px;font-weight:500;color:#5b5240}
@media (max-width:900px){.f-note .sticky{padding:14px 10px 10px}.f-note .sticky p{font-size:16px}.f-note .sticky p+p{display:none}}
.tile{background:#fff;border-radius:var(--r-md);padding:var(--s2);box-shadow:var(--sh-3);border:1px solid #fff;text-align:left}
.tile .row{display:flex;align-items:center;gap:12px}
.tick{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#7aa0ff,var(--blue));color:#fff;box-shadow:0 8px 16px rgba(61,109,255,.3)}
.tick .ic{width:20px;height:20px;stroke-width:2.4}
.tile b{display:block;font-size:15px;font-weight:600}
.tile small{display:block;font-size:13px;color:var(--muted)}
.tile .meta{display:flex;justify-content:space-between;gap:var(--s1);margin-top:var(--s2);padding-top:12px;border-top:1px dashed var(--hair);font-size:12px;color:var(--muted);white-space:nowrap}
.tile .meta span:last-child{color:var(--ink);font-weight:500}
.dial{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0,#f7f6f3 45%,#e9e7e2 100%);box-shadow:inset 0 2px 1px #fff,inset 0 -6px 12px rgba(13,15,18,.06),var(--sh-2)}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .read b{font:500 clamp(16px,2.2vw,28px)/1 var(--mono);letter-spacing:-.03em}
.dial .read small{font:500 12px var(--mono);color:var(--muted);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.receipt-wrap{filter:var(--ds-2)}
.receipt{position:relative;background:#fffdf9;padding:var(--s2) var(--s2) var(--s3);font:400 12px/1.6 var(--mono);color:#2c3036;text-align:left;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x}
.receipt h4{margin:0 0 6px;font:500 12px var(--mono);letter-spacing:.12em}
.receipt .ln2{display:flex;justify-content:space-between;gap:var(--s1)}
.receipt hr{border:0;border-top:1px dashed #c9c6bf;margin:6px 0}
.receipt .tot{font-weight:500;font-size:13px}

/* key-caps */
.keys{list-style:none;margin:var(--s4) 0 0;padding:0;display:grid;gap:var(--s2);grid-template-columns:repeat(5,minmax(0,1fr))}
.key{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:176px;padding:var(--s2) var(--s2) 20px;border-radius:var(--r-md);background:linear-gradient(180deg,#fff 0%,#fbfaf8 60%,#f4f3f0 100%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(13,15,18,.04),0 6px 0 -1px var(--key-side),var(--sh-2)}
.key .ko-box{width:68px;height:68px;margin:-4px 0 0 -4px}
.key b{font-size:16px;font-weight:500;line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.key small{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.key .n{position:absolute;top:var(--s2);right:var(--s2);font:500 12px var(--mono);color:var(--muted)}
@media (max-width:1060px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:599px){.keys{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s1)}.key{min-height:150px;padding:12px}.key .ko-box{width:48px;height:48px}.key b{font-size:15px}}

/* ---------- summary ---------- */
.flow{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin:var(--s3) 0 0;padding:0;list-style:none}
.flow li{position:relative;background:#fff;border-radius:var(--r-md);padding:var(--s3) var(--s2) var(--s2);box-shadow:var(--sh-1);border:1px solid #fff}
.flow li .k{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.flow li b{display:block;font-size:17px;font-weight:500;letter-spacing:-.02em;margin:6px 0 4px}
.flow li p{margin:0;font-size:14px;color:var(--muted)}
.flow li .vis{height:72px;display:flex;align-items:center;margin-bottom:var(--s2)}
.mini-note{width:64px;height:64px;padding:10px 6px;background:linear-gradient(160deg,#fff1bd,var(--note));border-radius:2px 2px 2px 10px;box-shadow:var(--sh-1);font:600 14px/1 var(--hand);color:#3a3326;transform:rotate(-5deg)}
.mini-tick{width:52px;height:52px}
.mini-dial{width:64px}
.mini-dial .read b{font-size:14px}
.mini-coin{display:flex;align-items:center;gap:6px;font:500 13px var(--mono)}
.mini-coin i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0b8,var(--signal));box-shadow:var(--sh-1)}

/* ---------- brand ---------- */
.part-head{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:flex-end;justify-content:space-between}
.sub-h{font-size:clamp(24px,2.6vw,32px);margin:var(--s10) 0 var(--s3)}
.sub-h small{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s1)}
.film{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--ink);aspect-ratio:16/9;box-shadow:var(--sh-3)}
.film iframe{display:block;width:100%;height:100%;border:0}
.film-bar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s2);color:var(--muted);font-size:14px}
.btn-ghost{display:inline-flex;align-items:center;gap:var(--s1);min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:var(--ink);font:500 15px var(--sans);box-shadow:var(--sh-1);cursor:pointer}
.tiles{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.btile{position:relative;border-radius:var(--r-md);padding:var(--s5) var(--s3) var(--s6);display:grid;place-items:center;min-height:200px;box-shadow:var(--sh-1)}
.btile .cap{position:absolute;left:var(--s2);bottom:12px;font-size:13px}
.btile.ink{background:var(--ink);color:#fff}.btile.ink .cap{color:#c9d1da}

.dk .sbar>div+div{border-left:1px solid var(--hair)}
.dk .sbar .go{flex:none;background:var(--ink);color:#fff;font-weight:500;padding:12px 26px;border-radius:999px}
.dk .keys{padding:0 64px;margin-top:40px;gap:16px;grid-template-columns:repeat(5,minmax(0,1fr))!important}
.dk .key{padding:16px 16px 20px}.dk .key .ko-box{width:68px;height:68px}.dk .key b{font-size:16px}
.dk .dial .read b{font-size:20px}
.dk .key{min-height:168px}
.dk .band{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:20px;padding:56px 64px 0}
.dk .band>div{background:rgba(255,255,255,.75);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-1)}
.dk .band>div:first-child{background:transparent;box-shadow:none;padding:4px 0}
.dk .band h4{font-size:24px;margin:0 0 6px}
.dk .band b{display:block;font-weight:500;font-size:16px;margin:8px 0 4px}
.dk .band p{margin:0;font-size:14px;color:var(--muted)}
.dk .band .num{font:500 12px var(--mono);color:var(--muted)}
.dk .honest{display:flex;align-items:center;gap:20px;margin:28px 64px 0;background:#fff;border-radius:var(--r-md);padding:20px 24px;box-shadow:var(--sh-1)}
.dk .honest .ill{width:96px;height:68px;flex:none}
.dk .honest p{margin:0;flex:1}
.dk .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:500;white-space:nowrap;background:#fff;box-shadow:0 0 0 1px var(--line) inset}
.dk .dfoot{display:flex;justify-content:space-between;padding:28px 64px 32px;margin-top:48px;border-top:1px solid var(--hair);color:var(--muted);font-size:13px}
.dk .dobj{position:absolute;pointer-events:none}
.dk .srch{display:grid;grid-template-columns:240px 1fr 380px;gap:24px;padding:24px 64px 0}
.dk .crumbs{display:flex;justify-content:space-between;align-items:flex-end;padding:48px 64px 0}
.dk .crumbs h3{font-size:36px;margin:0}
.dk .crumbs span{color:var(--muted)}
.dk .filters{display:grid;gap:14px;align-content:start;background:rgba(255,255,255,.82);border-radius:var(--r-md);padding:20px;box-shadow:var(--sh-1)}
.dk .filters b{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dk .opt{display:flex;align-items:center;gap:8px;font-size:14px}
.dk .opt i{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:5px;display:inline-block}
.dk .opt i.on{background:var(--ink)}
.dk .opt i.r{border-radius:50%}
.dk .res{display:grid;gap:12px;align-content:start}
.dk .rc{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:#fff;border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-1)}
.dk .rc .th{width:64px;height:64px;border-radius:14px;overflow:hidden}
.dk .rc .th svg{width:100%;height:100%;display:block}
.dk .rc h5{font-size:17px;margin:0 0 2px;font-weight:600;letter-spacing:-.015em}
.dk .rc .m{font-size:13px;color:var(--muted)}
.dk .rc .lbls{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dk .lbl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.dk .lbl.n{background:var(--sky);color:var(--blue-ink)}
.dk .lbl .ic{width:14px;height:14px}
.dk .price{font:500 14px var(--mono);text-align:right;white-space:nowrap}
.dk .price small{display:block;color:var(--muted);font-size:12px}
.dk .mapcol{border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-2);align-self:start}
.dk .mapcol svg{display:block;width:100%;height:auto}

/* ---------- journeys: one booking object travels the steps ---------- */
.journey{display:grid;gap:var(--s4);margin-top:var(--s5)}
@media (min-width:1060px){.journey{grid-template-columns:380px 1fr;align-items:start}}
.jside{display:grid;gap:var(--s3)}
@media (min-width:1060px){.jside{position:sticky;top:104px}}
.persona{background:#fff;border-radius:var(--r-md);padding:var(--s3);box-shadow:var(--sh-1)}
.persona .who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.persona .av{width:48px;height:48px;border-radius:50%;font-size:20px}
.persona p{color:var(--muted);margin:0 0 var(--s1)}
.persona p:last-child{margin:0;color:var(--ink)}
.stagebox{position:relative;height:300px;border-radius:var(--r-lg);background:rgba(255,255,255,.5);border:1px solid #fff;box-shadow:var(--sh-1);overflow:hidden;display:grid;place-items:center}
.stagebox .lbl-now{position:absolute;left:var(--s2);top:12px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stagebox .rail{position:absolute;left:var(--s3);right:var(--s3);bottom:var(--s3);height:4px;border-radius:4px;background:var(--canvas-2)}
.stagebox .rail i{position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,var(--blue-soft),var(--blue) 45%,var(--signal));transform-origin:left;transform:scaleX(var(--p,0));transition:transform .6s var(--ease)}
.stagebox .face{position:absolute;opacity:0;transform:translateY(16px) scale(.92);transition:opacity .5s var(--ease),transform .7s var(--spring)}
.stagebox .face.on{opacity:1;transform:none}
.face-note{width:180px}.face-tile{width:270px}.face-dial{width:170px}.face-rcpt{width:220px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol.steps>li{display:grid;grid-template-columns:72px 1fr;gap:var(--s2);align-items:start;background:rgba(255,255,255,.62);border:1px solid #fff;border-radius:var(--r-md);padding:var(--s2);transition:background .5s,box-shadow .5s,transform .5s var(--ease)}
ol.steps>li.on{background:#fff;box-shadow:var(--sh-2)}
ol.steps .thumbo{width:64px;height:64px;border-radius:var(--r);background:var(--canvas);display:grid;place-items:center;position:relative}
ol.steps .thumbo .k{position:absolute;left:6px;top:4px;font:500 11.5px var(--mono);color:var(--muted)}
ol.steps .thumbo .ic{width:26px;height:26px}
ol.steps b{font-weight:500;font-size:17px;letter-spacing:-.015em;display:block;margin-top:2px}
ol.steps p{margin:4px 0 0;color:var(--muted);font-size:15px}
ol.steps a{color:var(--ink)}
.actor{display:inline-block;font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--canvas-2);color:var(--ink);margin-right:6px}
.actor.c{background:var(--ink);color:#fff}
.actor.p{background:var(--sky);color:var(--blue-ink)}
.actor.x{background:var(--peach);color:#8a2a0a}
.whatif{background:#fff;border-radius:var(--r-md);padding:var(--s3);margin-top:var(--s2);box-shadow:var(--sh-1);display:grid;grid-template-columns:auto 1fr;gap:var(--s2)}
.whatif h4{font-size:19px;margin:0 0 6px}
.whatif ul{margin:0;padding-left:20px}
.whatif li+li{margin-top:6px}
.whatif .hand{font:600 34px/1 var(--hand);color:var(--blue-ink);transform:rotate(-6deg)}

/* ---------- roadmap ---------- */
.phases{list-style:none;margin:var(--s4) 0 0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.phases::before{content:"";position:absolute;left:4%;right:4%;top:27px;height:2px;background:repeating-linear-gradient(90deg,rgba(13,15,18,.2) 0 8px,transparent 8px 16px)}
.phases li{position:relative;display:grid;gap:6px;align-content:start}
.phases .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:500 15px var(--mono);background:#fff;box-shadow:var(--sh-1);position:relative;z-index:1}
.phases .done .dot{background:var(--ok-bg);color:var(--ok)}
.phases .now .dot{background:var(--ink);color:#fff;box-shadow:0 0 0 6px rgba(255,59,10,.18),var(--sh-2)}
.phases b{font-weight:500;font-size:16px;letter-spacing:-.015em;margin-top:6px}
.phases p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:1060px){.phases{grid-template-columns:1fr}.phases::before{left:27px;right:auto;top:20px;bottom:20px;width:2px;height:auto;background:repeating-linear-gradient(180deg,rgba(13,15,18,.2) 0 8px,transparent 8px 16px)}.phases li{grid-template-columns:56px 1fr;column-gap:var(--s2)}.phases .dot{grid-row:span 2}.phases b{margin-top:4px}}
.dec{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.dec li{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:12px var(--s2);box-shadow:var(--sh-1);font-size:15px}
.dec li .ic{color:var(--ok);margin-top:2px}
.dec li .id{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:var(--s1)}

/* ---------- footer ---------- */
.pagefoot{margin-top:var(--s12);padding:var(--s8) 0 var(--s6);border-top:1px solid var(--hair);color:var(--muted);font-size:14px}
.pagefoot .cx-lockup{width:min(360px,70vw);color:var(--ink);margin-bottom:var(--s3)}
.pagefoot .big{font-size:clamp(20px,2.2vw,26px);letter-spacing:-.02em;color:var(--ink);font-weight:500;max-width:36ch;margin-bottom:var(--s2)}

/* ---------- scroll reveals (motion only) ---------- */
html.motion [data-reveal]{opacity:0;transform:translateY(24px)}
html.motion [data-reveal].in{opacity:1;transform:none;transition:opacity .9s var(--ease),transform 1s var(--ease)}

@media (prefers-reduced-motion:reduce){
  .obj{animation:none}
  .pill,.stagebox .face,.stagebox .rail i,ol.steps>li,.menu-btn i,.sheet,.scrim{transition:none!important}
  .c-rotor{animation:none!important}
}

@media print{
  #intro,.top,.sheet,.scrim,.skip,.film-bar,.stagebox,.fold span{display:none!important}
  html.motion [data-reveal],html.motion .cover .reveal,html.motion .floats .obj-in{opacity:1!important;transform:none!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background-size:24px 24px}
  .cover{min-height:auto;padding:48px 0}
  .sec{break-before:page;padding-top:24px}
  .group{padding-top:32px}
  .group-head,.group>figure,.state,.card,.key,ol.steps>li,.whatif,.phases li,.tscroll,.browser,.btile,.sw,.principles li,.dash-wrap{break-inside:avoid}
  .keys{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px}.key{min-height:130px;padding:12px}.key .ko-box{width:44px;height:44px}.key b{font-size:13px}
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}.flow li{break-inside:avoid}
  .group-head{break-after:avoid}
  .cover{min-height:auto;padding:40px 0 24px}.cover .floats{display:none}
  .pagefoot{break-inside:avoid;margin-top:32px;padding-top:32px}
  h2,h3,h4,.sub-h,.eyebrow{break-after:avoid}
  .desk-in{zoom:.55!important}
  .jside{position:static}
  .obj{animation:none}
  .film{aspect-ratio:16/9;height:auto}
  /* print stays light: no blurred glows or soft drop-shadow filters (they rasterise into heavy PDF images) */
  .dash-glow,.cover .floats,.pagefoot .big{filter:none!important}
  .dash-glow{display:none}
  .ko,.receipt-wrap,.scr .rcpt{filter:none!important}
  *{box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .card,.state,.key,.flow li,.persona,.phone .shell,.sw,.btile,.principles li,.tone div,.dec li,.rules div,.whatif,ol.steps>li,.browser,.tscroll,.callout,.kpi,.dash{outline:1px solid #e2e0db}
}
</style>
</head>
<body>
{{symbols}}
{{part:objects}}
<a class="skip" href="#summary">Skip to the summary</a>
{{part:chrome}}
<main id="main">
{{part:cover}}
{{part:summary}}
{{part:brand}}
{{part:screens}}
{{part:desktop}}
{{part:journeys}}
{{part:roadmap}}
</main>
{{part:footer}}
{{part:script}}
</body>
</html>
