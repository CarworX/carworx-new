<!-- @dsCard group="States" height=844 width=390 subtitle="The same 404 at 390 × 844. On touch the loupe follows your finger." -->
<div class="cx-states">
<style>
:root{
  --canvas:#f2f1ee; --canvas-2:#e9e7e2; --dot:rgba(13,15,18,.12); --surface:#fff;
  --frost:rgba(255,255,255,.62); --frost-strong:rgba(255,255,255,.82); --frost-edge:rgba(255,255,255,.9);
  --hair:rgba(13,15,18,.09); --line:#dedcd6; --key-side:#e2e0db;
  --ink:#0d0f12; --graphite:#1c2128; --muted:#5b6470; --quiet:#727a85; --steel:#8a97a6;
  --blue:#3d6dff; --blue-ink:#2a54d4; --blue-soft:#a9c0ff; --sky:#e3eaff;
  --signal:#ff3b0a; --apricot:#ffb08a; --peach:#ffe3d4; --note:#ffe9a6;
  --sh-1:0 1px 1px rgba(13,15,18,.04),0 2px 6px rgba(13,15,18,.04),0 8px 24px rgba(13,15,18,.06);
  --sh-2:0 1px 2px rgba(13,15,18,.05),0 8px 16px rgba(13,15,18,.05),0 16px 32px rgba(13,15,18,.08),0 40px 80px rgba(13,15,18,.08);
  --sh-3:0 2px 3px rgba(13,15,18,.06),0 8px 24px rgba(13,15,18,.07),0 32px 64px rgba(13,15,18,.10),0 64px 120px rgba(13,15,18,.10);
  --ds-2:drop-shadow(0 2px 2px rgba(13,15,18,.07)) drop-shadow(0 16px 24px rgba(13,15,18,.14));
  --ds-3:drop-shadow(0 3px 3px rgba(13,15,18,.12)) drop-shadow(0 24px 24px rgba(13,15,18,.18));
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-hand:"Caveat","Segoe Print",cursive;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --gut:clamp(16px,4vw,48px); --dock-space:120px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--f-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.clean{--dock-space:0px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cxs-dark :focus-visible{outline-color:#fff}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grid-bg{background-color:var(--canvas);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.4px);background-size:24px 24px}
.eyebrow{font-family:var(--f-mono);font-size:12px;line-height:17px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.cxs-dark .eyebrow{color:#a7b1bd}

/* ---------- scenes ---------- */
.scene{position:fixed;inset:0;display:none;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent}
.scene.on{display:block}
.scene.fits{touch-action:none}
.scene.cxs-dark{background:var(--ink);color:#fff}
.fx{position:fixed;inset:0;width:100%;height:100%;display:block}
.fallback{position:fixed;inset:0;display:none}
.no-gl .fallback{display:block}

/* ---------- shared pieces ---------- */
.pill{position:relative;display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:500;font-size:16px;letter-spacing:-.005em;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,var(--sh-2);transition:transform .5s var(--ease)}
.pill::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--sh-3);opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.pill:hover{transform:translateY(-2px)} .pill:hover::after{opacity:1}
.pill .arr{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.pill:hover .arr{transform:translateX(3px)}
.pill.light{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.pill.light .arr{background:var(--canvas)}
.cxs-dark .pill{background:#fff;color:var(--ink);box-shadow:0 1px 0 #fff inset,0 10px 40px rgba(0,0,0,.35)}
.cxs-dark .pill .arr{background:var(--canvas)}
.tlink{display:inline-flex;align-items:center;height:44px;padding:0 4px;font-weight:500;font-size:16px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;text-decoration-color:rgba(13,15,18,.35);transition:text-decoration-color .3s}
.tlink:hover{text-decoration-color:currentColor}
.cxs-dark .tlink{text-decoration-color:rgba(255,255,255,.4)}

/* ---------- the 404 page ---------- */
.p404{position:relative;z-index:2;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:0 var(--gut) calc(var(--dock-space) + 24px)}
.p-head{height:88px;display:flex;align-items:center;justify-content:space-between}
.brand{display:block;width:124px;color:var(--ink)} .brand svg{display:block;width:100%;height:auto}
.cxs-dark .brand{color:#fff}
.p-main{align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 24px}
.p-h{font-size:clamp(32px,4vw,56px);line-height:1.04;font-weight:500;letter-spacing:-.04em;margin:16px 0 0;text-wrap:balance}
.p-h span{display:block} .p-h .grey{color:var(--quiet)}
.cxs-dark .p-h .grey{color:#8a97a6}
.p-sub{font-size:clamp(16px,1.3vw,18px);line-height:1.55;color:var(--muted);max-width:30em;margin:16px 0 0;text-wrap:pretty}
.cxs-dark .p-sub{color:#b4bcc6}
.p-act{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px 24px;margin-top:32px}
.p-svc{display:flex;flex-direction:column;align-items:center;gap:12px}
.p-svc ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:var(--frost-strong);border:1px solid var(--frost-edge);box-shadow:var(--sh-1);font-size:14px;font-weight:500;color:var(--graphite);white-space:nowrap;transition:transform .5s var(--spring)}
.chip svg{width:30px;height:30px;flex:none}
.chip:hover{transform:translateY(-2px)}
.cxs-dark .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);box-shadow:none;color:#e6eaee;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (max-width:600px){
  .p-head{height:68px} .brand{width:112px}
  .p-act{margin-top:24px;gap:4px 16px}
  .chip{height:36px;padding:0 10px;font-size:12.5px} .chip svg{display:none}
  .p-svc ul{gap:6px}
}

/* ---------- dock (review switcher, not part of the designs) ---------- */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 16px);font-family:var(--f-sans)}
.dock .cap,.dock .row{background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.9);box-shadow:var(--sh-2);border-radius:999px}
.dock .cap{display:flex;align-items:center;gap:10px;min-height:36px;padding:3px 4px 3px 14px;font-size:13px;color:var(--graphite);max-width:100%}
.dock .cap b{font-weight:600;white-space:nowrap}
.dock .cap .hint{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .cap .nf{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.dock .row{display:flex;align-items:center;gap:2px;padding:5px}
.dock .grp{display:flex;align-items:center;gap:2px}
.dock .sep{width:1px;height:24px;background:var(--hair);margin:0 6px}
.dock button{height:38px;min-width:36px;border-radius:999px;font-family:var(--f-mono);font-size:13px;font-weight:500;transition:background .2s}
.dock button:hover{background:rgba(13,15,18,.06)}
.dock button.gl{font-family:var(--f-sans);font-size:13px;padding:0 12px;color:var(--muted)}
.dock button[aria-current="true"]{background:var(--ink);color:#fff}
.dock .grp.on .gl{color:var(--ink)}
.dock .tog{display:flex;gap:2px;padding:2px;border-radius:999px;background:rgba(13,15,18,.05)}
.dock .tog button{height:30px;font-family:var(--f-sans);font-size:12px;padding:0 10px}
.dock .tog button[aria-pressed="true"]{background:#fff;box-shadow:var(--sh-1)}
body.clean .dock{display:none}
body[data-ground="dark"] .dock .cap,body[data-ground="dark"] .dock .row{background:rgba(28,33,40,.7);border-color:rgba(255,255,255,.08);color:#e6eaee}
body[data-ground="dark"] .dock .cap .hint,body[data-ground="dark"] .dock .cap .nf,body[data-ground="dark"] .dock button.gl{color:#a7b1bd}
body[data-ground="dark"] .dock .grp.on .gl{color:#fff}
body[data-ground="dark"] .dock button:hover{background:rgba(255,255,255,.08)}
body[data-ground="dark"] .dock button[aria-current="true"]{background:#fff;color:var(--ink)}
body[data-ground="dark"] .dock .tog{background:rgba(255,255,255,.06)}
body[data-ground="dark"] .dock .tog button[aria-pressed="true"]{background:rgba(255,255,255,.16);box-shadow:none}
body[data-ground="dark"] .dock :focus-visible{outline-color:#fff}
.dock .view[hidden]{display:none}
.dock button.tx{font-family:var(--f-sans);font-size:13px;padding:0 14px;white-space:nowrap}
@media (max-width:700px){
  .dock .grp:not(.on) button:not(.gl){display:none}
  .dock .cap .hint,.dock .cap .nf{display:none}
  .dock button{min-width:34px}
}

/* ---------- 404 · 4 dot-grid lens ---------- */
.lens-slot{width:100%;height:clamp(150px,30vh,290px);margin-bottom:16px}
.lens-num{display:none}

/* ---------- loading: splash and in-use boards ---------- */
.splash{position:fixed;inset:0;display:grid;place-items:center}
.use{display:none;position:relative;min-height:100%;padding:72px var(--gut) calc(var(--dock-space) + 40px)}
.scene[data-view="use"] .use{display:block}
.scene[data-view="use"] .splash{display:none}
.use-h{max-width:1180px;margin:0 auto 28px}
.use-h h2{font-size:clamp(28px,3vw,40px);line-height:1.1;font-weight:500;letter-spacing:-.035em;margin:8px 0 0;text-wrap:balance}
.use-h h2 .grey{color:var(--quiet)}
.use-g{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"page btn" "page list";gap:16px}
.u{position:relative;min-width:0;background:var(--frost-strong);border:1px solid var(--frost-edge);border-radius:24px;box-shadow:var(--sh-1);padding:20px}
.u>.eyebrow{display:block;margin-bottom:16px}
.u-page{grid-area:page;display:flex;flex-direction:column} .u-page .mock{flex:1} .u-btn{grid-area:btn} .u-list{grid-area:list} .u-sizes{grid-column:1/-1}
@media (max-width:900px){ .use-g{grid-template-columns:minmax(0,1fr);grid-template-areas:"page" "btn" "list"} }
.mock{border-radius:16px;background:#fff;border:1px solid var(--hair);overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.mock-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:16px 18px;border-bottom:1px solid var(--hair)}
.mock-top b{font-size:17px;font-weight:500;letter-spacing:-.015em}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.mock-body{position:relative;flex:1;display:grid;place-items:center;padding:28px 18px;min-height:260px}
.lcap{font-size:14px;color:var(--muted);text-align:center;margin:14px 0 0;min-height:21px}
.bstack{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.pill.busy{cursor:progress}
.pill.busy .arr canvas,.pill.busy .arr svg{display:block}
.u .caption{font-size:13px;line-height:18px;color:var(--muted);margin:16px 0 0;text-wrap:pretty}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rc2{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:16px;background:#fff;border:1px solid var(--hair)}
.rc2 .th{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--sky)}
.rc2 .th.p{background:var(--peach)} .rc2 .th svg{width:40px;height:40px}
.rc2 b{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc2 small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc2 .tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.rc2 .ld{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.rc2 .ld .mono{font-family:var(--f-mono);color:var(--ink)}
.mono{font-family:var(--f-mono)}

/* loader 3: hold dial */
.hd{position:relative;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0,#f7f6f3 45%,#e9e7e2 100%);box-shadow:inset 0 2px 1px #fff,inset 0 -6px 12px rgba(13,15,18,.06),var(--sh-2)}
.hd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hd .read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono)}
.hd .read b{font-weight:500;letter-spacing:-.03em;line-height:1}
.hd .read small{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.roll{position:relative;overflow:hidden;height:28px;text-align:center}
.roll span{position:absolute;left:0;right:0;top:0;white-space:nowrap;transition:transform .7s var(--ease),opacity .7s var(--ease)}
.roll span.in{transform:translateY(0);opacity:1}
.roll span.wait{transform:translateY(100%);opacity:0}
.roll span.out{transform:translateY(-100%);opacity:0}
.reduce .roll span{transition:none}
.steps{display:flex;gap:6px;justify-content:center;margin-top:16px}
.steps i{width:22px;height:4px;border-radius:2px;background:rgba(13,15,18,.1);position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(var(--f,0));transform-origin:left}
.spin-ring{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-ring .arc{transform-origin:50% 50%;animation:spin 1s linear infinite}
.reduce .spin-ring .arc{animation:none}
/* loader 4: skeleton */
.sk{position:relative;overflow:hidden;background:rgba(13,15,18,.06);border-radius:8px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.85) 50%,transparent 80%);animation:shim 1.9s cubic-bezier(.45,0,.25,1) infinite;animation-delay:var(--d,0s)}
@keyframes shim{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.reduce .sk::after{animation:none;opacity:0}
.skp{position:absolute;inset:0;overflow:hidden}
.skp-nav{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 32px));height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;border-radius:999px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.85);box-shadow:var(--sh-1)}
.skp-nav .brand{width:120px}
.skp-nav .lnk{display:flex;gap:24px} .skp-nav .lnk .sk{width:72px;height:10px}
.skp-nav .sk.pl{width:150px;height:48px;border-radius:999px}
.skp-body{position:absolute;top:104px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 32px));bottom:0}
.skp-field{display:flex;align-items:center;gap:12px;height:60px;padding:0 10px 0 20px;border-radius:999px;background:#fff;box-shadow:var(--sh-1);border:1px solid var(--hair);font-size:16px}
.skp-field .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skp-field .q span{color:var(--muted)}
.skp-field .st{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.keys5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0 22px;max-width:760px}
.kc{position:relative;height:96px;border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#fff 0%,#fbfaf8 60%,#f4f3f0 100%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(13,15,18,.04),0 6px 0 -1px var(--key-side),var(--sh-1);animation:press 1.6s cubic-bezier(.34,1.56,.64,1) infinite;animation-delay:var(--kd)}
.kc svg{width:40px;height:40px;margin:-2px 0 0 -4px;filter:var(--ds-2)}
.kc span{font-size:13px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
@keyframes press{0%,30%,100%{transform:translateY(0)}12%{transform:translateY(5px)}}
.reduce .kc{animation:none}
.skp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:16px}
.skc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px;border-radius:24px;background:var(--frost-strong);border:1px solid var(--frost-edge);box-shadow:var(--sh-1);margin-bottom:12px}
.skc .sk.t{height:96px;border-radius:16px}
.skc .ls{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.skc .ls .sk{height:12px}
.skmap{position:relative;border-radius:24px;overflow:hidden;background:var(--frost-strong);border:1px solid var(--frost-edge);box-shadow:var(--sh-1);height:452px}
.skmap .grid-bg{position:absolute;inset:0;background-color:#f7f6f3}
.skmap .pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#fff;box-shadow:var(--sh-1);border:1px solid var(--hair)}
.skmap .pin.me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;transform:none;box-shadow:0 0 0 8px rgba(61,109,255,.14)}
@media (max-width:900px){ .skp-grid{grid-template-columns:1fr} .skmap{display:none} .skp-nav .lnk{display:none} }
@media (max-width:600px){ .skp-nav{height:56px;padding-left:16px} .skp-nav .sk.pl{width:44px;height:44px} .skp-body{top:88px} .keys5{gap:6px;margin:14px 0 16px} .kc{height:76px;padding:8px;border-radius:14px} .kc span{display:none} .kc svg{width:44px;height:44px;margin:auto} .skc{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px} .skc .sk.t{height:72px} .skp-field{height:54px;font-size:15px} .skp-field .st{display:none} }
.mini-keys{display:inline-flex;gap:3px;align-items:center}
.mini-keys i{width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.9;animation:mk 1.6s cubic-bezier(.34,1.56,.64,1) infinite;animation-delay:var(--kd)}
@keyframes mk{0%,30%,100%{transform:translateY(-2px);opacity:.45}12%{transform:translateY(2px);opacity:1}}
.reduce .mini-keys i{animation:none;opacity:.7}
/* loader 5 */
.dr-cap{position:fixed;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
canvas.mini{display:block}

/* ---------- approved set: the 404 in a phone frame ---------- */
.phone{--k:1;display:none;position:fixed;inset:0;align-items:center;justify-content:center;gap:56px;padding:24px var(--gut) calc(var(--dock-space) + 24px)}
#s-404-4[data-view="phone"] .phone{display:flex}
#s-404-4[data-view="phone"] > .fx,#s-404-4[data-view="phone"] > .p404{display:none}
.ph-box{width:calc(414px * var(--k));height:calc(868px * var(--k));flex:none}
.ph-dev{position:relative;width:414px;height:868px;padding:12px;border-radius:64px;background:linear-gradient(160deg,#2a3038,var(--ink) 30%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),var(--sh-3);transform:scale(var(--k));transform-origin:0 0}
.ph-scr{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--canvas);isolation:isolate}
.ph-scr iframe{display:block;width:390px;height:844px;border:0}
.ph-note{max-width:280px}
.ph-note h2{font-size:28px;line-height:1.1;font-weight:500;letter-spacing:-.035em;margin:10px 0 0}
.ph-note p{font-size:15px;line-height:1.55;color:var(--muted);margin:12px 0 0}
@media (max-width:1000px){ .ph-note{display:none} }
/* ---------- approved set: where each loader goes ---------- */
#s-use .use{display:block}
.sg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"watch skel" "btn list" "between between"}
.sg .u{display:flex;flex-direction:column} .sg .u .mock{flex:1}
.u-t{font-size:17px;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:-6px 0 16px}
.u .caption b{font-weight:600;color:var(--graphite)}
.u .caption .tlink{height:auto;font-size:13px;padding:0;text-underline-offset:4px}
.tp{position:relative;height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--hair)}
.tp-c{position:absolute;inset:0}
.tp-cap{position:absolute;left:50%;top:calc(50% + 62px);transform:translateX(-50%);margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
@media (max-width:900px){ .sg{grid-template-columns:minmax(0,1fr);grid-template-areas:"btn" "watch" "skel" "list" "between"} .tp{height:260px} }

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){ .pill,.pill .arr,.chip{transition:none} }
.reduce .pill,.reduce .chip{transition:none}

/* ---------- Approved set: where each loader goes, by scenario ---------- */

/* ---------- Approved set: the 404 in a phone frame, live (an iframe of this page). On a real phone it is simply full screen. ---------- */
(() => {

/* =====================================================================
   Shell: dock, routing, one rAF loop, pause when hidden.
   Each page lists its routes: { id (the hash), scene, group (dock group), label (dock button), title (dock caption) }.
   A scene may offer views ([[key, label]], first is the default), skip() to stand still, and onView(v).
   ===================================================================== */
const LIST = [
  { id: '404', scene: '404-4', group: '404', label: '404', title: '404 · Dot-grid lens', tx: true },
  { id: 'between', scene: 'load-5', group: 'load', label: 'Between pages', title: 'Between pages · Dot-grid ripple', tx: true },
  { id: 'use', scene: 'use', group: 'use', label: 'Where each loader goes', title: 'Where each loader goes', tx: true },
];
let active = null, activeId = null, raf = 0, last = 0;
const dock = $('#dock'), entry = (id) => LIST.find((x) => x.id === id);
for (const e of LIST) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = e.label; b.dataset.id = e.id;
  if (e.tx) b.className = 'tx'; if (e.aria) b.setAttribute('aria-label', e.aria);
  $(`.grp[data-kind="${e.group}"]`, dock).appendChild(b);
}
const lastOf = {}; for (const e of LIST) lastOf[e.group] = lastOf[e.group] || e.id;
dock.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.id) go(b.dataset.id);
  else if (b.dataset.kind) go(lastOf[b.dataset.kind]);
  else if (b.dataset.view) setView(b.dataset.view);
  else if (b.id === 'dStill') setReduced(!reduced, true);
});
const viewsOf = (S) => (typeof S.views === 'function' ? S.views() : S.views) || null;

  const vs = viewsOf(active), t = $('.view', dock), v = active.el.dataset.view, keys = vs ? vs.map((x) => x.join()).join('|') : '';
  t.hidden = !vs;
  if (t._k !== keys) { t._k = keys; t.innerHTML = vs ? vs.map(([k, l]) => `<button type="button" data-view="${k}">${l}</button>`).join('') : ''; }

}

  history.replaceState(null, '', '#' + activeId + (vs && v && v !== vs[0][0] ? '/' + v : '') + [...flags].map((f) => '&' + f).join(''));
}
const fits = () => active.el.classList.toggle('fits', entry(activeId).group === '404' && active.el.scrollHeight <= innerHeight + 1);
function go(id, view) {
  const e = entry(id), S = e && SCENES[e.scene]; if (!S) return;

  const t0 = performance.now(); active.frame(t, dt); STATS.push(performance.now() - t0);
}
const STATS = { a: [], push(v) { this.a.push(v); if (this.a.length > 600) this.a.shift(); }, read() { const s = [...this.a].sort((x, y) => x - y); return { n: s.length, avg: s.reduce((p, c) => p + c, 0) / (s.length || 1), p95: s[Math.floor(s.length * .95)] || 0, max: s[s.length - 1] || 0 }; }, clear() { this.a = []; } };

RM.addEventListener('change', (e) => setReduced(e.matches || flags.has('still')));

// pointer and touch: routed to the active concept only
const route = (e) => {
  if (e.type === 'pointermove' || e.type === 'pointerdown') { PTR.x = e.clientX; PTR.y = e.clientY; PTR.t = now(); PTR.type = e.pointerType; }

addEventListener('keydown', (e) => {

// start: the first route, or #<route>[/<view>], flags &clean &still
(function boot() {

  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).then(start);
